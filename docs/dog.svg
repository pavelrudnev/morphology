<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>

  <!-- Круг с обводкой -->
  <circle cx="200" cy="200" r="180" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Содержимое, обрезанное по кругу -->
  <g clip-path="url(#circleClip)">
    <!-- Верхняя половина (фон) -->
    <rect x="20" y="20" width="360" height="180" fill="#ffffff"/>

    <!-- Нижняя половина (фон) -->
    <rect x="20" y="200" width="360" height="180" fill="#e8e8e8"/>

    <!-- Горизонтальная разделительная линия -->
    <line x1="20" y1="200" x2="380" y2="200" stroke="#000000" stroke-width="3"/>

    <!-- ===== СОБАКА В ПРОФИЛЬ (верхняя половина) ===== -->
    <g transform="translate(200, 145)">

      <!-- ===== Задние лапы (дальние) ===== -->
      <rect x="30" y="20" width="11" height="45" rx="4" fill="#a8a8a8" stroke="#000000" stroke-width="1.8"/>
      <!-- Задняя лапа (дальняя) -->
      <rect x="42" y="20" width="11" height="45" rx="4" fill="#a8a8a8" stroke="#000000" stroke-width="1.8"/>

      <!-- ===== Передние лапы (дальние) ===== -->
      <rect x="-52" y="20" width="11" height="45" rx="4" fill="#a8a8a8" stroke="#000000" stroke-width="1.8"/>
      <rect x="-64" y="20" width="11" height="45" rx="4" fill="#a8a8a8" stroke="#000000" stroke-width="1.8"/>

      <!-- Хвост -->
      <path d="M55,-10 Q80,-25 78,-50 Q76,-60 68,-58"
            fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

      <!-- Тело (вид сбоку) -->
      <ellipse cx="0" cy="0" rx="65" ry="30" fill="#d0d0d0" stroke="#000000" stroke-width="2"/>

      <!-- Задняя лапа (ближняя) -->
      <rect x="28" y="18" width="13" height="50" rx="5" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
      <!-- Задняя лапа (ближняя) вторая -->
      <rect x="44" y="18" width="13" height="50" rx="5" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>

      <!-- Передняя лапа (ближняя) -->
      <rect x="-54" y="18" width="13" height="50" rx="5" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
      <!-- Передняя лапа (ближняя) вторая -->
      <rect x="-68" y="18" width="13" height="50" rx="5" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>

      <!-- Шея -->
      <path d="M-55,-15 Q-70,-30 -75,-40"
            fill="none" stroke="#d0d0d0" stroke-width="22" stroke-linecap="round"/>
      <path d="M-55,-15 Q-70,-30 -75,-40"
            fill="none" stroke="#000000" stroke-width="2"/>

      <!-- Голова (профиль) -->
      <ellipse cx="-80" cy="-52" rx="30" ry="24" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>

      <!-- Ухо -->
      <path d="M-70,-72 Q-65,-95 -78,-90 Q-88,-85 -85,-68 Z"
            fill="#a0a0a0" stroke="#000000" stroke-width="2"/>

      <!-- Морда -->
      <ellipse cx="-105" cy="-45" rx="18" ry="14" fill="#f5f5f5" stroke="#000000" stroke-width="1.8"/>

      <!-- Нос -->
      <ellipse cx="-120" cy="-48" rx="6" ry="5" fill="#000000"/>

      <!-- Рот -->
      <path d="M-120,-43 Q-112,-36 -104,-42"
            fill="none" stroke="#000000" stroke-width="1.5"/>

      <!-- Язык -->
      <ellipse cx="-112" cy="-33" rx="4" ry="6" fill="#b0b0b0" stroke="#000000" stroke-width="1"/>

      <!-- Глаз -->
      <circle cx="-88" cy="-58" r="4.5" fill="#000000"/>
      <circle cx="-87" cy="-59" r="1.5" fill="#ffffff"/>
    </g>

    <!-- ===== ФОНЕТИЧЕСКАЯ ТРАНСКРИПЦИЯ (нижняя половина) ===== -->
    <text x="200" y="305" font-family="'Noto Sans', sans-serif"
          font-size="72" fill="#000000" text-anchor="middle" font-weight="bold"
          letter-spacing="2">/dɒɡ/</text>
  </g>

  <!-- Внешняя обводка круга -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#000000" stroke-width="4"/>
</svg>